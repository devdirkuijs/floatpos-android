name: Build FloatPOS APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icon & splash
        run: npx @capacitor/assets generate --android --splashBackgroundColor "#0b1730" --splashBackgroundColorDark "#0b1730"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Add camera permission (for the in-app barcode scanner)
        run: |
          MF=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />#' "$MF"
          echo "---- manifest permissions after patch ----"
          grep -n "uses-permission\|uses-feature" "$MF"

      - name: Build release APK (unsigned)
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/floatpos-release.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "Using build-tools: $BT"
          UNSIGNED=android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/floatpos-aligned.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/floatpos-release.jks" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD \
            --out floatpos.apk \
            "$RUNNER_TEMP/floatpos-aligned.apk"
          "$BT/apksigner" verify --verbose floatpos.apk
          rm -f "$RUNNER_TEMP/floatpos-release.jks"
          echo "---- signed APK ----"; ls -la floatpos.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: FloatPOS-release-apk
          path: floatpos.apk
          if-no-files-found: error
