name: Build FloatPOS APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      # ── NEW ────────────────────────────────────────────────────────────
      # The printer plugin has to be an npm dependency for `cap sync` to
      # register it. Without this the plugin simply is not in the build --
      # which is why the APK Trinity analysed had only INTERNET and CAMERA.
      #
      # Adjust the path if the plugin folder sits elsewhere in the repo.
      - name: Install the FloatPOS printer plugin
        run: |
          if [ -d "./floatpos-printer" ]; then
            npm install ./floatpos-printer
            echo "printer plugin installed from ./floatpos-printer"
          else
            echo "ERROR: ./floatpos-printer not found in the repo."
            echo "Contents of repo root:"; ls -la
            exit 1
          fi

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icon & splash
        run: npx @capacitor/assets generate --android --splashBackgroundColor "#0b1730" --splashBackgroundColorDark "#0b1730"

      - name: Sync Capacitor
        run: npx cap sync android

      # ── NEW ────────────────────────────────────────────────────────────
      # The MobiPrint SDK is a local .aar. Capacitor's app/build.gradle only
      # has `fileTree(include: ['*.jar'], dir: 'libs')`, so copying the .aar
      # into app/libs never put MobiiotAPI on the runtime classpath. Patch
      # fileTree to include *.aar so AGP unpacks the AAR (and its nested jars).
      - name: Install MobiPrint SDK into the app module
        run: |
          set -e
          AAR=$(find . -name "mp-mobiiot-sdk-*.aar" -not -path "./android/*" | head -1)
          if [ -z "$AAR" ]; then
            echo "ERROR: mp-mobiiot-sdk-*.aar not found in the repo."
            exit 1
          fi
          mkdir -p android/app/libs
          cp "$AAR" android/app/libs/
          echo "copied $AAR ($(wc -c < "$AAR") bytes)"
          echo "---- android/app/libs ----"
          ls -la android/app/libs/
          GRADLE=android/app/build.gradle
          if [ -f "$GRADLE" ]; then
            sed -i "s/include: \['\*.jar'\]/include: ['*.jar', '*.aar']/" "$GRADLE"
            echo "patched app/build.gradle fileTree to include AARs"
          else
            echo "ERROR: $GRADLE missing after cap add"
            exit 1
          fi
          echo "---- fileTree line ----"
          grep -n "fileTree" "$GRADLE" || true


      # ── NEW ────────────────────────────────────────────────────────────
      # versionCode is how an MDM decides a build is newer. Capacitor
      # defaults it to 1 and `cap add android` resets it every run, so every
      # build shipped as version 1 -- and Trinity's TMS would never have seen
      # an update. The run number always increases, so it is a safe source.
      - name: Set versionCode and versionName
        run: |
          GRADLE=android/app/build.gradle
          VC=${{ github.run_number }}
          VN="1.0.$VC"
          sed -i "s/versionCode .*/versionCode $VC/" "$GRADLE"
          sed -i "s/versionName .*/versionName \"$VN\"/" "$GRADLE"
          echo "---- version after patch ----"
          grep -n "versionCode\|versionName" "$GRADLE"

      - name: Add camera permission (for the in-app barcode scanner)
        run: |
          MF=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />#' "$MF"
          echo "---- manifest permissions after patch ----"
          grep -n "uses-permission\|uses-feature" "$MF"

      - name: Build release APK (unsigned)
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease -x lintVitalRelease --no-daemon --stacktrace
          echo "---- release output dir ----"
          ls -la app/build/outputs/apk/release/ || true

      - name: Sign release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          CLEAN=$(printf '%s' "$KEYSTORE_BASE64" | tr -cd 'A-Za-z0-9+/=')
          echo "cleaned base64 length: ${#CLEAN}  (should be 3624)"
          printf '%s' "$CLEAN" | base64 -d > "$RUNNER_TEMP/floatpos-release.jks"
          echo "keystore size: $(wc -c < "$RUNNER_TEMP/floatpos-release.jks") bytes  (should be 2716)"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "Using build-tools: $BT"
          UNSIGNED=$(find android/app/build/outputs/apk/release -name "*-unsigned.apk" | head -1)
          if [ -z "$UNSIGNED" ]; then UNSIGNED=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1); fi
          echo "Unsigned APK: $UNSIGNED"
          if [ -z "$UNSIGNED" ]; then echo "ERROR: no release APK produced"; exit 1; fi
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/floatpos-aligned.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/floatpos-release.jks" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD \
            --out floatpos.apk \
            "$RUNNER_TEMP/floatpos-aligned.apk"
          "$BT/apksigner" verify --verbose floatpos.apk
          rm -f "$RUNNER_TEMP/floatpos-release.jks"
          echo "---- signed APK ----"; ls -la floatpos.apk

      # ── NEW ────────────────────────────────────────────────────────────
      # Fail here rather than in Trinity's MDM queue. If the printer class is
      # not in the APK, the build is not the one we think it is, and finding
      # that out now costs a minute instead of an approval cycle.
      - name: Verify the printer plugin actually made it in
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "---- manifest summary ----"
          "$BT/aapt2" dump xmltree floatpos.apk --file AndroidManifest.xml | grep -E "sagereal|printraw|START_PRINTER|CONN_PRINTIO|queries|package" || true
          echo "---- looking for printer classes in dex ----"
          unzip -l floatpos.apk | grep -i "classes" || true
          STRINGS=$(unzip -p floatpos.apk classes.dex classes2.dex classes3.dex classes4.dex classes5.dex classes6.dex classes7.dex classes8.dex 2>/dev/null | strings || true)
          fail=0
          echo "$STRINGS" | grep -q "FloatPrinterPlugin" && echo "OK: FloatPrinterPlugin" || { echo "MISSING: FloatPrinterPlugin"; fail=1; }
          echo "$STRINGS" | grep -q "MobiiotAPI" && echo "OK: MobiiotAPI" || { echo "MISSING: MobiiotAPI (SDK not in APK)"; fail=1; }
          echo "$STRINGS" | grep -q "printESCPOS" && echo "OK: printESCPOS" || { echo "MISSING: printESCPOS"; fail=1; }
          echo "$STRINGS" | grep -q "PrintIOInterface" && echo "OK: PrintIOInterface" || { echo "MISSING: PrintIOInterface"; fail=1; }
          if [ "$fail" -ne 0 ]; then
            echo "ERROR: printer runtime is incomplete. Do not ship this build."
            exit 1
          fi
          echo "---- hashes to send ----"
          echo "size:   $(wc -c < floatpos.apk) bytes"
          echo "md5:    $(md5sum floatpos.apk | cut -d' ' -f1)"
          echo "sha256: $(sha256sum floatpos.apk | cut -d' ' -f1)"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: FloatPOS-release-apk
          path: floatpos.apk
          if-no-files-found: error
