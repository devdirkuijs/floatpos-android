ext {
    androidxAppCompatVersion = project.hasProperty('androidxAppCompatVersion') ? rootProject.ext.androidxAppCompatVersion : '1.7.0'
}

apply plugin: 'com.android.library'

android {
    namespace "za.co.floatpos.printer"
    compileSdk project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 35
    defaultConfig {
        minSdk project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 23
        targetSdk project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 35
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    lintOptions { abortOnError false }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation project(':capacitor-android')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    // compileOnly: the plugin compiles against the MobiIoT SDK but does not
    // bundle it. A library module is not allowed to package a local .aar into
    // its own .aar -- the classes would be silently dropped. The SDK is added
    // to the APP module by the workflow instead, where local .aar files are
    // supported, and it is present at runtime from there.
    compileOnly fileTree(dir: '../../floatpos-printer/android/libs', include: ['*.aar', '*.jar'])
}
