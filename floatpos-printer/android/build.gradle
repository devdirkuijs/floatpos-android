ext {
    androidxAppCompatVersion = project.hasProperty('androidxAppCompatVersion') ? rootProject.ext.androidxAppCompatVersion : '1.7.0'
}

apply plugin: 'com.android.library'

android {
    namespace "za.co.floatpos.printer"
    compileSdk project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 35
    defaultConfig {
        minSdk project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 23
        targetSdk project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 35
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    lintOptions { abortOnError false }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation project(':capacitor-android')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    // compileOnly: compile against the SDK, do not embed it in this library.
    // The GitHub workflow explodes the AAR into android/app/libs so the app
    // module actually ships MobiiotAPI / CsPrinter (Capacitor's default
    // fileTree only picks up *.jar, so copying the .aar alone was a no-op).
    compileOnly fileTree(dir: 'libs', include: ['*.aar', '*.jar'])
    compileOnly fileTree(dir: '../../floatpos-printer/android/libs', include: ['*.aar', '*.jar'])
}
